[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tau-mcp"
version = "1.0.0"
description = "Tel Aviv University (TAU) Model Context Protocol (MCP) Server for AI Assistants"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "TAU AI Tools"}
]
keywords = ["mcp", "tel-aviv-university", "tau", "gemini", "claude", "moodle"]
dependencies = [
    "mcp>=1.0.0",
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "playwright>=1.30.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-core>=2.0.0"
]

[project.scripts]
tau-mcp = "tau_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tau_mcp*"]
